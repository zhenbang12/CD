<html lang="en">
<head>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./css/style.css" />
  <script>
    if (!localStorage.getItem('eco_session')) {
      window.location.href = 'login.html';
    }
  </script>

  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌿</text></svg>">
</head>
<body>
  <div id="app">
    <header class="app-header">
      <div class="header-left">
        <a href="./index.html" class="brand-logo" style="text-decoration: none;">
          <span class="logo-mark">🌿</span>
          <div class="brand-text">
            <span class="brand-name">EcoHotel OS</span>
            <span class="brand-sub">Hospitality Management</span>
          </div>
        </a>
        <div class="hotel-pill"><span class="hotel-dot"></span><span>Grand Bay Eco-Resort & Spa</span></div>
      </div>
            <div class="header-right" style="display: flex; gap: 10px; align-items: center;">
        <span class="badge badge-primary">Standalone</span>
        <a href="./index.html" class="btn btn-sm btn-outline" style="text-decoration: none;">Master Portal</a>
        <button onclick="localStorage.removeItem('eco_session'); window.location.href='login.html'" class="btn btn-sm" style="background: var(--danger); color: white; border: none;">Logout</button>
      </div>
    </header>

    <nav class="main-navbar">
      <div class="nav-tabs-container">
        <a href="./m1-dashboard.html" class="nav-tab" style="text-decoration: none;"><span class="tab-icon">??</span><span class="tab-text">Executive Analytics</span></a>
        <a href="./m2-inventory.html" class="nav-tab" style="text-decoration: none;"><span class="tab-icon">📦</span><span class="tab-text">Inventory & Spoilage</span></a>
        <a href="./m3-batch-optimization.html" class="nav-tab" style="text-decoration: none;"><span class="tab-icon">🍳</span><span class="tab-text">Batch Optimization</span></a>
        <a href="./m4-guest-pwa.html" class="nav-tab active" style="text-decoration: none;"><span class="tab-icon">🌿</span><span class="tab-text">Guest PWA & Rooms</span></a>
        <a href="./m5-facilities.html" class="nav-tab" style="text-decoration: none;"><span class="tab-icon">⚡</span><span class="tab-text">Facilities & Repairs</span></a>
        <a href="./m3-guide.html" class="nav-tab" style="text-decoration: none;"><span class="tab-icon">📖</span><span class="tab-text">M3 User Guide</span></a>
      </div>
    </nav>

    <main class="main-content" id="m4-mount"></main>
    <div id="toast-container" class="toast-container"></div>
  </div>

  <script type="module">
    import { db } from './js/db/storage.js';
    import { Module4GuestPWA } from './js/modules/m4GuestPWA.js';

    window.showGlobalToast = (message, type = 'info') => {
      const container = document.getElementById('toast-container');
      if (!container) return;
      const toast = document.createElement('div');
      toast.className = `toast toast-${type} fade-in`;
      toast.innerHTML = `<div class="toast-content">${message}</div><button class="toast-close">&times;</button>`;
      container.appendChild(toast);
      toast.querySelector('.toast-close').onclick = () => toast.remove();
      setTimeout(() => { toast.remove(); }, 3500);
    };

    document.addEventListener('DOMContentLoaded', () => {
      const mount = document.getElementById('m4-mount');
      if (mount) new Module4GuestPWA(mount);
    });
  </script>
</body>
</html>
