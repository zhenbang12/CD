<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EcoHotel OS • Visit Malaysia 2026 Sustainable Hospitality Platform</title>
  <meta name="description" content="A comprehensive three-tier sustainable hotel operating system integrating executive sustainability analytics, predictive kitchen batching, in-room guest eco-PWA, and facilities anomaly detection." />

  <!-- Google Fonts: Inter & JetBrains Mono for Nordic Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <!-- App Stylesheet -->
  <link rel="stylesheet" href="./css/style.css?v=3.4" />
  <script>
    if (!localStorage.getItem('eco_session')) {
      window.location.href = 'login.html';
    }
    (function() {
      try {
        var t = localStorage.getItem('ecohotel_theme');
        if (!t) {
          var db = JSON.parse(localStorage.getItem('ECOHOTEL_OS_DATABASE_VM2026_PROD') || '{}');
          t = (db.system && db.system.theme) ? db.system.theme : 'light';
        }
        if (t === 'dark') {
          document.documentElement.classList.add('theme-dark');
          document.documentElement.classList.remove('theme-light');
        } else {
          document.documentElement.classList.remove('theme-dark');
          document.documentElement.classList.add('theme-light');
        }
      } catch (e) {}
    })();
  </script>

  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌿</text></svg>">
</head>
<body>
  <!-- App Mounting Container -->
  <div id="app"></div>

  <!-- Master JavaScript Application (ES Modules) -->
  <script type="module" src="./js/app.js?v=3.3"></script>
</body>
</html>
