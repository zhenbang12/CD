<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Module 3: Predictive F&B Batch Optimization Engine • EcoHotel OS</title>
  <meta name="description" content="Predictive F&B Batch Optimization Engine - Lead PIC: Zhen Bang. Multi-factor algorithmic batching matching 48h guest influx, recipe BOM yields, and decayed plate-waste feedback loops." />

  <!-- Google Fonts: Inter & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <!-- App Stylesheet -->
  <link rel="stylesheet" href="./css/style.css" />
  <script>
    if (!localStorage.getItem('eco_session')) {
      window.location.href = 'login.html';
    }
    (function() {
      try {
        var t = localStorage.getItem('ecohotel_theme');
        if (!t) {
          var db = JSON.parse(localStorage.getItem('ECOHOTEL_OS_DATABASE_VM2026_PROD') || '{}');
          t = (db.system && db.system.theme) ? db.system.theme : 'light';
        }
        if (t === 'dark') {
          document.documentElement.classList.add('theme-dark');
          document.documentElement.classList.remove('theme-light');
        } else {
          document.documentElement.classList.remove('theme-dark');
          document.documentElement.classList.add('theme-light');
        }
      } catch (e) {}
    })();
  </script>

  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌿</text></svg>">
</head>
<body>
  <div id="app">
    <!-- Top Header -->
    <header class="app-header">
      <div class="header-left">
        <a href="./index.html" class="brand-logo" style="text-decoration: none;">
          <span class="logo-mark">🌿</span>
          <div class="brand-text">
            <span class="brand-name">EcoHotel OS</span>
            <span class="brand-sub">Hospitality Management</span>
          </div>
        </a>
        
        <div class="hotel-pill">
          <span class="hotel-dot"></span>
          <span>Grand Bay Eco-Resort & Spa</span>
        </div>
      </div>

            <div class="header-right" style="display: flex; gap: 8px; align-items: center;">
        <button id="btn-standalone-refresh-db" class="btn btn-xs btn-primary" style="display: inline-flex; align-items: center; gap: 4px; padding: 4px 10px; font-size: 11.5px; font-weight: 600;" title="Refresh and sync database from backend for all">
          <svg id="icon-standalone-refresh" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/></svg>
          <span id="text-standalone-refresh">Refresh DB</span>
        </button>
        <button id="btn-standalone-reset-db" class="btn btn-xs btn-outline" style="display: inline-flex; align-items: center; gap: 4px; padding: 4px 10px; font-size: 11.5px;" title="Reset database to initial seed data">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
          Reset DB
        </button>
        <a href="./index.html" class="btn btn-xs btn-outline" style="text-decoration: none; padding: 4px 8px; font-size: 11.5px;">Master Portal</a>
        <button onclick="localStorage.removeItem('eco_session'); window.location.href='login.html'" class="btn btn-xs btn-outline" style="padding: 4px 8px; font-size: 11.5px;">Logout</button>
      </div>
    </header>

    <!-- Page Navigation Bar -->
    <nav class="main-navbar">
      <div class="nav-tabs-container">
        <a href="./m1-dashboard.html" class="nav-tab" style="text-decoration: none;">
          <span class="tab-icon">📊</span>
          <span class="tab-text">Executive Analytics</span>
        </a>
        <a href="./m2-inventory.html" class="nav-tab" style="text-decoration: none;">
          <span class="tab-icon">📦</span>
          <span class="tab-text">Inventory & Spoilage</span>
        </a>
        <a href="./m3-batch-optimization.html" class="nav-tab active" style="text-decoration: none;">
          <span class="tab-icon">🍳</span>
          <span class="tab-text">Batch Optimization</span>
        </a>
        <a href="./m4-guest-pwa.html" class="nav-tab" style="text-decoration: none;">
          <span class="tab-icon">🌿</span>
          <span class="tab-text">Guest PWA & Rooms</span>
        </a>
        <a href="./m5-facilities.html" class="nav-tab" style="text-decoration: none;">
          <span class="tab-icon">⚡</span>
          <span class="tab-text">Facilities & Repairs</span>
        </a>
        <a href="./m3-guide.html" class="nav-tab" style="text-decoration: none;">
          <span class="tab-icon">📖</span>
          <span class="tab-text">M3 User Guide</span>
        </a>
      </div>
    </nav>

    <!-- Dedicated Mount Point for Module 3 -->
    <main class="main-content" id="m3-standalone-mount"></main>
    <div id="toast-container" class="toast-container"></div>
  </div>

  <!-- Script initialization for standalone Module 3 -->
  <script type="module">
    import { db } from './js/db/storage.js';
    import { Module3BatchOptimizer } from './js/modules/m3BatchOptimization.js?v=2.2';

    // Global toast handler
    window.showGlobalToast = (message, type = 'info') => {
      const container = document.getElementById('toast-container');
      if (!container) return;
      const toast = document.createElement('div');
      toast.className = `toast toast-${type} fade-in`;
      const icon = type === 'success' ? '🌿' : type === 'warning' ? '⚠️' : type === 'danger' ? '🚨' : 'ℹ️';
      toast.innerHTML = `
        <div style="display: flex; align-items: center; gap: 8px;">
          <span>${icon}</span>
          <div class="toast-content">${message}</div>
        </div>
        <button class="toast-close">&times;</button>
      `;
      container.appendChild(toast);
      toast.querySelector('.toast-close').onclick = () => toast.remove();
      setTimeout(() => { toast.remove(); }, 3500);
    };

    document.addEventListener('DOMContentLoaded', () => {
      const refreshBtn = document.getElementById('btn-standalone-refresh-db');
      if (refreshBtn) {
        refreshBtn.onclick = async () => {
          const icon = document.getElementById('icon-standalone-refresh');
          const text = document.getElementById('text-standalone-refresh');
          if (icon) icon.classList.add('spin-animation');
          if (text) text.textContent = 'Syncing...';
          refreshBtn.disabled = true;

          try {
            const res = await db.refreshDatabase();
            if (res && res.success) {
              window.showGlobalToast?.('Database refreshed & synchronized for all!', 'success');
              setTimeout(() => window.location.reload(), 400);
            } else {
              window.showGlobalToast?.(`Local sync completed (${res?.error || 'offline'})`, 'warning');
            }
          } catch (e) {
            window.showGlobalToast?.('Sync error: ' + e.message, 'error');
          } finally {
            if (icon) icon.classList.remove('spin-animation');
            if (text) text.textContent = 'Refresh DB';
            refreshBtn.disabled = false;
          }
        };
      }

      const resetBtn = document.getElementById('btn-standalone-reset-db');
      if (resetBtn) {
        resetBtn.onclick = () => {
          if (confirm('Reset database to factory defaults? All modified baselines, logs, and tickets will be restored.')) {
            db.resetDatabase();
            window.location.reload();
          }
        };
      }

      const mount = document.getElementById('m3-standalone-mount');
      if (mount) {
        new Module3BatchOptimizer(mount);
      }
    });
  </script>
</body>
</html>
